<!DOCTYPE html>
<html lang="en">
<head>

    <title>Logout | Exclusive</title>

    <link rel="stylesheet" href="../header.css">
    <link rel="stylesheet" href="logout.css">
    <link rel="stylesheet" href="../footer.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <a href="../home/home.html">Exclusive</a>
        </div>

        <nav>
            <ul>
                <li><a href="../home/home.html">Home</a></li>
                <li><a href="../products/products.html">Products</a></li>
                <li><a href="../about/about.html">About</a></li>
                <li><a href="../contact/contact.html">Contact</a></li>
                <li><a href="../signup/signup.html">Sign Up</a></li>
            </ul>
        </nav>

        <div class="header-right">
            <div class="search-box">
                <input type="text"
                       placeholder="What are you looking for?">
                <button type="button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <a href="../wishlist/wishlist.html" class="icon">
                <i class="fa-regular fa-heart"></i>
            </a>

            <a href="../cart/cart.html" class="icon">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

            <a href="../account/account.html" class="icon">
                <i class="fa-regular fa-user"></i>
            </a>
        </div>
    </header>

    <!-- LOGOUT -->
    <main class="logout-container">
        <div class="logout-box">
            <i class="fa-solid fa-right-from-bracket logout-icon"></i>

            <h1>Logout</h1>

            <p>Are you sure you want to log out of your account?</p>

            <div class="logout-buttons">
                <button id="confirmLogout" class="logout-btn">
                    Yes, Logout
                </button>

                <a href="../home/home.html" class="cancel-btn">
                    Cancel
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-container">
            <div>
                <h2>Exclusive</h2>
                <p>Your favourite online shopping website.</p>
            </div>

            <div>
                <h3>Quick Links</h3>
                <a href="../home/home.html">Home</a>
                <a href="../products/products.html">Products</a>
                <a href="../contact/contact.html">Contact</a>
                <a href="../about/about.html">About</a>
            </div>
        </div>

        <p class="copyright">
            Copyright © 2026 Exclusive. All rights reserved.
        </p>
    </footer>

   <script src="logout.js"></script>
